<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="heroTitle heroDesc" preserveAspectRatio="xMidYMid meet">
  <title id="heroTitle">Supernova Multiplatform Architecture Blueprint</title>
  <desc id="heroDesc">Architectural blueprint of unified Web, Mobile, and Desktop systems connected to an enterprise cloud engine.</desc>
  <defs>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Technical Background Grid -->
  <g opacity="0.45" stroke="#cbd5e1" stroke-width="0.8">
    <line x1="40" y1="40" x2="760" y2="40" stroke-dasharray="4 6"/>
    <line x1="40" y1="180" x2="760" y2="180" stroke-dasharray="4 6"/>
    <line x1="40" y1="320" x2="760" y2="320" stroke-dasharray="4 6"/>
    <line x1="40" y1="460" x2="760" y2="460" stroke-dasharray="4 6"/>
    <line x1="40" y1="580" x2="760" y2="580" stroke-dasharray="4 6"/>
    <line x1="80" y1="20" x2="80" y2="600" stroke-dasharray="4 6"/>
    <line x1="240" y1="20" x2="240" y2="600" stroke-dasharray="4 6"/>
    <line x1="400" y1="20" x2="400" y2="600" stroke-dasharray="4 6"/>
    <line x1="560" y1="20" x2="560" y2="600" stroke-dasharray="4 6"/>
    <line x1="720" y1="20" x2="720" y2="600" stroke-dasharray="4 6"/>
  </g>

  <!-- Coordinate Markers -->
  <g font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" letter-spacing="1">
    <text x="45" y="32">ARCH: MULTI-01</text>
    <text x="690" y="32">SCALE: INF</text>
    <text x="45" y="598">LATENCY: &lt;45ms</text>
    <text x="680" y="598">SLA: 99.98%</text>
  </g>

  <!-- Background Ambient Glows -->
  <circle cx="400" cy="240" r="180" fill="#3b82f6" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="620" cy="380" r="140" fill="#8b5cf6" opacity="0.07" filter="url(#softGlow)"/>
  <circle cx="180" cy="360" r="140" fill="#06b6d4" opacity="0.07" filter="url(#softGlow)"/>

  <!-- Interconnecting Data Pathways -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center to Top-Left (Web) -->
    <path d="M 400 240 L 400 130 L 250 130" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8"/>
    <!-- Center to Top-Right (Desktop) -->
    <path d="M 400 240 L 400 130 L 550 130" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8"/>
    <!-- Center to Bottom-Center (Mobile) -->
    <path d="M 400 300 L 400 380" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8"/>
    <!-- Cross Sync -->
    <path d="M 250 190 Q 250 360 330 420" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 550 190 Q 550 360 470 420" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 1. LEFT CARD: WEB PLATFORM SYSTEM -->
  <g transform="translate(60, 60)" filter="url(#subtleShadow)">
    <rect width="250" height="170" rx="14" fill="url(#cardBg)" stroke="#bfdbfe" stroke-width="1.8"/>
    <!-- Browser Top Bar -->
    <rect width="250" height="28" rx="14" fill="#0f172a"/>
    <rect x="0" y="14" width="250" height="14" fill="#0f172a"/>
    <circle cx="16" cy="14" r="4" fill="#ef4444"/>
    <circle cx="28" cy="14" r="4" fill="#f59e0b"/>
    <circle cx="40" cy="14" r="4" fill="#10b981"/>
    <rect x="56" y="8" width="130" height="13" rx="4" fill="#1e293b"/>
    <text x="64" y="18" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8">https://web.app/enterprise</text>
    <rect x="212" y="8" width="26" height="13" rx="4" fill="#0284c7"/>
    <text x="216" y="18" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#ffffff">SSR</text>

    <!-- Browser Body Content -->
    <g transform="translate(14, 40)">
      <!-- Metric Pill -->
      <rect width="80" height="22" rx="6" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
      <circle cx="12" cy="11" r="4" fill="#06b6d4"/>
      <text x="22" y="15" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0e7490">Lighthouse 100</text>

      <!-- Code Line Graphic -->
      <g transform="translate(90, 4)">
        <rect width="130" height="4" rx="2" fill="#e2e8f0"/>
        <rect y="8" width="95" height="4" rx="2" fill="#bae6fd"/>
        <rect y="16" width="115" height="4" rx="2" fill="#e2e8f0"/>
      </g>

      <!-- UI Wireframe Grid -->
      <rect y="32" width="105" height="48" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
      <rect x="8" y="40" width="34" height="20" rx="4" fill="#2563eb" opacity="0.15"/>
      <rect x="48" y="42" width="48" height="6" rx="2" fill="#64748b"/>
      <rect x="48" y="52" width="32" height="4" rx="2" fill="#94a3b8"/>

      <rect x="115" y="32" width="105" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <!-- Sparkline chart -->
      <polyline points="122,70 140,58 158,64 176,46 194,52 210,40" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="210" cy="40" r="3" fill="#0284c7"/>

      <!-- Platform Tag -->
      <rect y="88" width="220" height="24" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="12" y="104" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0369a1">WEB ECOSYSTEM</text>
      <text x="135" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#0284c7">Astro · React · Edge</text>
    </g>
  </g>

  <!-- 2. RIGHT CARD: DESKTOP APPS SYSTEM -->
  <g transform="translate(490, 60)" filter="url(#subtleShadow)">
    <rect width="250" height="170" rx="14" fill="url(#cardBg)" stroke="#ddd6fe" stroke-width="1.8"/>
    <!-- Terminal Header -->
    <rect width="250" height="28" rx="14" fill="#0f172a"/>
    <rect x="0" y="14" width="250" height="14" fill="#0f172a"/>
    <circle cx="16" cy="14" r="4" fill="#ef4444"/>
    <circle cx="28" cy="14" r="4" fill="#f59e0b"/>
    <circle cx="40" cy="14" r="4" fill="#10b981"/>
    <text x="56" y="18" font-family="ui-monospace, monospace" font-size="9" fill="#a78bfa">tauri://desktop-runtime:native</text>

    <!-- Terminal & App UI Body -->
    <g transform="translate(14, 38)">
      <!-- Status Badge -->
      <rect width="90" height="20" rx="5" fill="#faf5ff" stroke="#e9d5ff"/>
      <circle cx="10" cy="10" r="3.5" fill="#a855f7"/>
      <text x="20" y="14" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#7e22ce">Offline-First POS</text>

      <!-- Mini Datagrid Table -->
      <g transform="translate(0, 26)">
        <rect width="220" height="16" rx="4" fill="#f1f5f9"/>
        <text x="8" y="12" font-family="ui-monospace, monospace" font-size="7.5" font-weight="bold" fill="#475569">THREAD</text>
        <text x="68" y="12" font-family="ui-monospace, monospace" font-size="7.5" font-weight="bold" fill="#475569">LOCAL DB</text>
        <text x="140" y="12" font-family="ui-monospace, monospace" font-size="7.5" font-weight="bold" fill="#475569">SYNC STATUS</text>

        <rect y="20" width="220" height="14" rx="2" fill="#ffffff" stroke="#f1f5f9"/>
        <text x="8" y="30" font-family="ui-monospace, monospace" font-size="7.5" fill="#0284c7">#01_Core</text>
        <text x="68" y="30" font-family="ui-monospace, monospace" font-size="7.5" fill="#475569">SQLite (Encrypted)</text>
        <text x="140" y="30" font-family="ui-monospace, monospace" font-size="7.5" fill="#10b981">✓ Ready (0ms)</text>

        <rect y="38" width="220" height="14" rx="2" fill="#ffffff" stroke="#f1f5f9"/>
        <text x="8" y="48" font-family="ui-monospace, monospace" font-size="7.5" fill="#0284c7">#02_Queue</text>
        <text x="68" y="48" font-family="ui-monospace, monospace" font-size="7.5" fill="#475569">Hardware SDK</text>
        <text x="140" y="48" font-family="ui-monospace, monospace" font-size="7.5" fill="#10b981">✓ Connected</text>
      </g>

      <!-- Platform Tag -->
      <rect y="90" width="220" height="24" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
      <text x="12" y="106" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#6b21a8">DESKTOP APPS</text>
      <text x="135" y="106" font-family="ui-monospace, monospace" font-size="9" fill="#9333ea">Tauri · Rust · Electron</text>
    </g>
  </g>

  <!-- 3. CENTER ENGINE: UNIFIED CLOUD API & DATA LAYER -->
  <g transform="translate(280, 180)" filter="url(#subtleShadow)">
    <!-- Hex / Stadium Shape Core Box -->
    <rect width="240" height="124" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="4" y="4" width="232" height="116" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Pulse Signal Indicator -->
    <circle cx="28" cy="28" r="8" fill="#22c55e" opacity="0.25"/>
    <circle cx="28" cy="28" r="4" fill="#22c55e"/>
    <text x="44" y="32" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" fill="#38bdf8" letter-spacing="1">SUPERNOVA ENGINE</text>

    <!-- Core Specs Grid -->
    <g transform="translate(20, 48)">
      <rect width="95" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="8" y="16" font-family="ui-monospace, monospace" font-size="7.5" fill="#94a3b8">API PIPELINE</text>
      <text x="8" y="26" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#f8fafc">Go / Node.js</text>

      <rect x="105" y="0" width="95" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="113" y="16" font-family="ui-monospace, monospace" font-size="7.5" fill="#94a3b8">DATA CLUSTER</text>
      <text x="113" y="26" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#f8fafc">Postgres + Redis</text>

      <!-- Telemetry Bar -->
      <g transform="translate(0, 38)">
        <rect width="200" height="22" rx="6" fill="#090d16" stroke="#1e293b"/>
        <text x="8" y="15" font-family="ui-monospace, monospace" font-size="8" fill="#22c55e">● REST &amp; GraphQL</text>
        <text x="122" y="15" font-family="ui-monospace, monospace" font-size="8" fill="#38bdf8">E2E TLS v1.3</text>
      </g>
    </g>
  </g>

  <!-- 4. BOTTOM CARD: MOBILE ECOSYSTEM (iOS & Android) -->
  <g transform="translate(260, 360)" filter="url(#subtleShadow)">
    <!-- Device Frame -->
    <rect width="280" height="210" rx="24" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <rect x="6" y="6" width="268" height="198" rx="20" fill="url(#cardBg)"/>

    <!-- Phone Speaker Notch & Dynamic Island -->
    <rect x="105" y="12" width="70" height="12" rx="6" fill="#0f172a"/>
    <circle cx="162" cy="18" r="3" fill="#2563eb"/>

    <!-- Mobile UI Content -->
    <g transform="translate(20, 34)">
      <!-- App Header Bar -->
      <text x="2" y="12" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Customer Portal</text>
      <rect x="180" y="2" width="56" height="16" rx="8" fill="#dbeafe"/>
      <text x="188" y="14" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#1d4ed8">ACTIVE</text>

      <!-- Account Balance / Card -->
      <rect y="22" width="240" height="58" rx="10" fill="url(#coreGrad)"/>
      <text x="14" y="40" font-family="system-ui, sans-serif" font-size="8.5" fill="#bfdbfe">Total Transactions</text>
      <text x="14" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Rp 1.482.900.000</text>
      <circle cx="214" cy="51" r="14" fill="#ffffff" opacity="0.2"/>
      <path d="M 210 51 L 214 47 L 218 51 M 214 48 L 214 56" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

      <!-- Action Grid -->
      <g transform="translate(0, 88)">
        <rect width="54" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="27" cy="14" r="6" fill="#dbeafe"/>
        <text x="14" y="28" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#334155">Orders</text>

        <rect x="62" width="54" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="89" cy="14" r="6" fill="#ecfeff"/>
        <text x="76" y="28" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#334155">Tracking</text>

        <rect x="124" width="54" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="151" cy="14" r="6" fill="#fae8ff"/>
        <text x="139" y="28" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#334155">Report</text>

        <rect x="186" width="54" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="213" cy="14" r="6" fill="#dcfce7"/>
        <text x="202" y="28" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#334155">Payout</text>
      </g>

      <!-- Platform Subtitle -->
      <g transform="translate(0, 130)">
        <rect width="240" height="24" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="10" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">NATIVE MOBILE APPS</text>
        <text x="142" y="16" font-family="ui-monospace, monospace" font-size="9" fill="#2563eb">Flutter · React Native</text>
      </g>
    </g>
  </g>

  <!-- Accent Floating Feature Badges -->
  <g transform="translate(48, 300)" filter="url(#subtleShadow)">
    <rect width="138" height="36" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="8" fill="#dbeafe"/>
    <path d="M 16 18 L 19 21 L 24 15" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="17" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">Zero Lock-in</text>
    <text x="36" y="27" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">100% IP Handover</text>
  </g>

  <g transform="translate(614, 300)" filter="url(#subtleShadow)">
    <rect width="142" height="36" rx="18" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="8" fill="#f3e8ff"/>
    <path d="M 16 18 L 19 21 L 24 15" stroke="#9333ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="17" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">Security Hardened</text>
    <text x="36" y="27" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">OWASP Top 10 Ready</text>
  </g>

</svg>