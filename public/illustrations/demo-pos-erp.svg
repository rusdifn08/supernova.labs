<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" role="img" aria-labelledby="posTitle" preserveAspectRatio="xMidYMid meet">
  <title id="posTitle">All-In-One POS ERP CRM Finance System</title>
  <defs>
    <filter id="posShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Technical Blueprint Frame -->
  <rect x="20" y="20" width="540" height="340" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6" filter="url(#posShadow)"/>
  <rect x="20" y="20" width="540" height="30" rx="16" fill="#0f172a"/>
  <rect x="20" y="36" width="540" height="14" fill="#0f172a"/>
  <circle cx="38" cy="35" r="4" fill="#ef4444"/>
  <circle cx="50" cy="35" r="4" fill="#f59e0b"/>
  <circle cx="62" cy="35" r="4" fill="#10b981"/>
  <text x="78" y="39" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" fill="#38bdf8">SYSTEM // POS-ERP-CRM-FINANCE-INTEGRATED</text>
  <text x="430" y="39" font-family="ui-monospace, monospace" font-size="8.5" fill="#10b981">● REALTIME SYNC</text>

  <!-- Left: POS Cashier Terminal -->
  <g transform="translate(40, 68)">
    <rect width="240" height="270" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect width="240" height="26" rx="12" fill="#1e293b"/>
    <rect y="12" width="240" height="14" fill="#1e293b"/>
    <text x="14" y="17" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#38bdf8">01. SMART POS KASIR</text>

    <!-- Cashier Items -->
    <g transform="translate(12, 38)">
      <rect width="216" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="8" y="16" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#0f172a">Espresso Roast 250g</text>
      <text x="8" y="26" font-family="ui-monospace, monospace" font-size="7.5" fill="#64748b">SKU: ESP-001 · 2 x Rp 65.000</text>
      <text x="160" y="22" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#2563eb">Rp 130.000</text>

      <rect y="40" width="216" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="8" y="56" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#0f172a">Artisan Matcha Latte</text>
      <text x="8" y="66" font-family="ui-monospace, monospace" font-size="7.5" fill="#64748b">SKU: MTC-004 · 1 x Rp 38.000</text>
      <text x="165" y="62" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#2563eb">Rp 38.000</text>

      <!-- Customer CRM Tag -->
      <rect y="82" width="216" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="8" y="98" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#1e40af">CRM: Budi (Gold Tier · 420 Poin)</text>

      <!-- Subtotal & Checkout -->
      <g transform="translate(0, 118)">
        <text x="0" y="12" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">SUBTOTAL</text>
        <text x="150" y="12" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" fill="#0f172a">Rp 168.000</text>
        
        <rect y="22" width="216" height="34" rx="8" fill="#10b981"/>
        <text x="108" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">BAYAR SEKARANG (QRIS/CASH)</text>
      </g>
    </g>
  </g>

  <!-- Right: ERP, Inventory & Finance -->
  <g transform="translate(300, 68)">
    <!-- ERP Inventory Box -->
    <rect width="240" height="125" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="240" height="24" rx="12" fill="#0f172a"/>
    <rect y="10" width="240" height="14" fill="#0f172a"/>
    <text x="12" y="16" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#a78bfa">02. ERP STOCK &amp; INVENTORY</text>

    <g transform="translate(12, 34)">
      <text x="0" y="12" font-family="ui-monospace, monospace" font-size="8" fill="#475569">BIJI KOPI ARABICA</text>
      <rect y="16" width="160" height="6" rx="3" fill="#e2e8f0"/>
      <rect y="16" width="135" height="6" rx="3" fill="#10b981"/>
      <text x="175" y="22" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#10b981">85% AMAN</text>

      <text x="0" y="38" font-family="ui-monospace, monospace" font-size="8" fill="#475569">CUP TAKEAWAY 16OZ</text>
      <rect y="42" width="160" height="6" rx="3" fill="#e2e8f0"/>
      <rect y="42" width="30" height="6" rx="3" fill="#ef4444"/>
      <text x="175" y="48" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#ef4444">18% REORDER</text>

      <rect y="58" width="216" height="22" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
      <text x="8" y="73" font-family="ui-monospace, monospace" font-size="7.5" fill="#7c3aed">● Pemantauan Karyawan: 12 Staff Hadir Aktif</text>
    </g>

    <!-- Finance Cashflow Box -->
    <g transform="translate(0, 138)">
      <rect width="240" height="132" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
      <text x="14" y="22" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#60a5fa">03. KEUANGAN &amp; LABA BERSIH</text>

      <g transform="translate(14, 34)">
        <rect width="100" height="42" rx="6" fill="#1e293b"/>
        <text x="8" y="16" font-family="ui-monospace, monospace" font-size="7.5" fill="#94a3b8">PENJUALAN HARI INI</text>
        <text x="8" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#22c55e">Rp 8.450.000</text>

        <rect x="110" width="100" height="42" rx="6" fill="#1e293b"/>
        <text x="118" y="16" font-family="ui-monospace, monospace" font-size="7.5" fill="#94a3b8">HPP &amp; PENGELUARAN</text>
        <text x="118" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f87171">Rp 3.120.000</text>

        <rect y="50" width="210" height="34" rx="6" fill="#090d16" stroke="#1e293b"/>
        <text x="8" y="68" font-family="ui-monospace, monospace" font-size="7.5" fill="#38bdf8">NET ESTIMATED PROFIT :</text>
        <text x="8" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">+ Rp 5.330.000 (63.07%)</text>
      </g>
    </g>
  </g>
</svg>