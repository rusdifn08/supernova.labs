<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="methodTitle" preserveAspectRatio="xMidYMid meet">
  <title id="methodTitle">Supernova Engineering Methodology Pipeline</title>
  <defs>
    <filter id="mShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Technical Pipeline Line -->
  <line x1="60" y1="180" x2="500" y2="180" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="60" y1="180" x2="380" y2="180" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 4"/>

  <!-- Step 01: Discover & Schema -->
  <g transform="translate(40, 50)" filter="url(#mShadow)">
    <rect width="130" height="95" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
    <rect width="130" height="22" rx="10" fill="#1e3a8a"/>
    <rect y="10" width="130" height="12" fill="#1e3a8a"/>
    <text x="10" y="15" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#ffffff">01 / DISCOVERY</text>

    <g transform="translate(10, 30)">
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">Schema &amp; Flows</text>
      <rect y="16" width="110" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect y="22" width="85" height="3" rx="1.5" fill="#bae6fd"/>
      <rect y="28" width="100" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect y="40" width="110" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="6" y="51" font-family="ui-monospace, monospace" font-size="7" fill="#1d4ed8">✓ System Specs Locked</text>
    </g>
  </g>
  <circle cx="105" cy="180" r="14" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
  <circle cx="105" cy="180" r="5" fill="#ffffff"/>
  <line x1="105" y1="145" x2="105" y2="166" stroke="#2563eb" stroke-width="2"/>

  <!-- Step 02: Prototype & Sprints -->
  <g transform="translate(215, 215)" filter="url(#mShadow)">
    <rect width="130" height="95" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.6"/>
    <rect width="130" height="22" rx="10" fill="#3730a3"/>
    <rect y="10" width="130" height="12" fill="#3730a3"/>
    <text x="10" y="15" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#ffffff">02 / SPRINT CI/CD</text>

    <g transform="translate(10, 30)">
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">Weekly Deploy</text>
      <rect y="16" width="110" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect y="22" width="70" height="3" rx="1.5" fill="#c7d2fe"/>
      <rect y="28" width="95" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect y="40" width="110" height="16" rx="4" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="6" y="51" font-family="ui-monospace, monospace" font-size="7" fill="#4338ca">✓ Live Staging Preview</text>
    </g>
  </g>
  <circle cx="280" cy="180" r="14" fill="#4f46e5" stroke="#ffffff" stroke-width="3"/>
  <circle cx="280" cy="180" r="5" fill="#ffffff"/>
  <line x1="280" y1="194" x2="280" y2="215" stroke="#4f46e5" stroke-width="2"/>

  <!-- Step 03: QA, Handover & Docs -->
  <g transform="translate(390, 50)" filter="url(#mShadow)">
    <rect width="130" height="95" rx="10" fill="#ffffff" stroke="#67e8f9" stroke-width="1.6"/>
    <rect width="130" height="22" rx="10" fill="#0e7490"/>
    <rect y="10" width="130" height="12" fill="#0e7490"/>
    <text x="10" y="15" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#ffffff">03 / HANDOVER</text>

    <g transform="translate(10, 30)">
      <text x="0" y="10" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">QA &amp; IP Transfer</text>
      <rect y="16" width="110" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect y="22" width="85" height="3" rx="1.5" fill="#a5f3fc"/>
      <rect y="28" width="105" height="3" rx="1.5" fill="#e2e8f0"/>
      <rect y="40" width="110" height="16" rx="4" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="6" y="51" font-family="ui-monospace, monospace" font-size="7" fill="#0e7490">✓ 100% Code Ownership</text>
    </g>
  </g>
  <circle cx="455" cy="180" r="14" fill="#06b6d4" stroke="#ffffff" stroke-width="3"/>
  <circle cx="455" cy="180" r="5" fill="#ffffff"/>
  <line x1="455" y1="145" x2="455" y2="166" stroke="#06b6d4" stroke-width="2"/>

</svg>