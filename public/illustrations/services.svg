<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="servicesTitle" preserveAspectRatio="xMidYMid meet">
  <title id="servicesTitle">Unified Web Mobile Desktop Services Ecosystem</title>
  <defs>
    <linearGradient id="srvPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="srvShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Technical Background Grid -->
  <g opacity="0.35" stroke="#60a5fa" stroke-width="0.8">
    <circle cx="280" cy="180" r="140" fill="none" stroke="#60a5fa" stroke-dasharray="4 6"/>
    <circle cx="280" cy="180" r="70" fill="none" stroke="#38bdf8" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Sync Hub -->
  <circle cx="280" cy="180" r="32" fill="#090d16" stroke="#38bdf8" stroke-width="2" filter="url(#srvShadow)"/>
  <circle cx="280" cy="180" r="12" fill="#2563eb" opacity="0.6"/>
  <circle cx="280" cy="180" r="6" fill="#38bdf8"/>

  <!-- Orbital Connection Lines -->
  <path d="M 120 100 Q 200 120 280 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 440 100 Q 360 120 280 180" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 280 290 L 280 180" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 1. Web Portal Node (Top Left) -->
  <g transform="translate(30, 40)" filter="url(#srvShadow)">
    <rect width="180" height="110" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="1.6"/>
    <rect width="180" height="24" rx="12" fill="#1e293b"/>
    <rect y="12" width="180" height="12" fill="#1e293b"/>
    <circle cx="14" cy="12" r="3" fill="#ef4444"/>
    <circle cx="23" cy="12" r="3" fill="#f59e0b"/>
    <circle cx="32" cy="12" r="3" fill="#10b981"/>
    <text x="44" y="15" font-family="ui-monospace, monospace" font-size="7.5" fill="#94a3b8">web.supernova.app</text>
    
    <g transform="translate(12, 34)">
      <rect width="76" height="16" rx="4" fill="#1e3a8a"/>
      <text x="6" y="11" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold" fill="#60a5fa">WEB ECOSYSTEM</text>
      <rect y="22" width="156" height="4" rx="2" fill="#334155"/>
      <rect y="30" width="120" height="4" rx="2" fill="#0284c7"/>
      <rect y="38" width="90" height="4" rx="2" fill="#334155"/>
      
      <rect y="48" width="156" height="18" rx="4" fill="#0f172a" stroke="#1e3a8a"/>
      <text x="8" y="60" font-family="ui-monospace, monospace" font-size="7.5" fill="#38bdf8">SSR · SaaS · PWA · Edge</text>
    </g>
  </g>

  <!-- 2. Desktop System Node (Top Right) -->
  <g transform="translate(350, 40)" filter="url(#srvShadow)">
    <rect width="180" height="110" rx="12" fill="#090d16" stroke="#c084fc" stroke-width="1.6"/>
    <rect width="180" height="24" rx="12" fill="#1e293b"/>
    <rect y="12" width="180" height="12" fill="#1e293b"/>
    <circle cx="14" cy="12" r="3" fill="#ef4444"/>
    <circle cx="23" cy="12" r="3" fill="#f59e0b"/>
    <circle cx="32" cy="12" r="3" fill="#10b981"/>
    <text x="44" y="15" font-family="ui-monospace, monospace" font-size="7.5" fill="#c084fc">tauri.system.local</text>
    
    <g transform="translate(12, 34)">
      <rect width="78" height="16" rx="4" fill="#581c87"/>
      <text x="6" y="11" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold" fill="#d8b4fe">DESKTOP SYSTEM</text>
      <rect y="22" width="156" height="4" rx="2" fill="#334155"/>
      <rect y="30" width="130" height="4" rx="2" fill="#7c3aed"/>
      <rect y="38" width="100" height="4" rx="2" fill="#334155"/>
      
      <rect y="48" width="156" height="18" rx="4" fill="#0f172a" stroke="#581c87"/>
      <text x="8" y="60" font-family="ui-monospace, monospace" font-size="7.5" fill="#c084fc">POS · Industrial ERP · Offline</text>
    </g>
  </g>

  <!-- 3. Mobile Apps Node (Bottom Center) -->
  <g transform="translate(190, 210)" filter="url(#srvShadow)">
    <rect width="180" height="120" rx="16" fill="#090d16" stroke="#34d399" stroke-width="1.6"/>
    <rect width="180" height="24" rx="16" fill="#1e293b"/>
    <rect y="12" width="180" height="12" fill="#1e293b"/>
    <rect x="74" y="7" width="32" height="4" rx="2" fill="#475569"/>
    <circle cx="160" cy="9" r="3" fill="#34d399"/>
    
    <g transform="translate(14, 34)">
      <rect width="72" height="16" rx="4" fill="#064e3b"/>
      <text x="6" y="11" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold" fill="#6ee7b7">MOBILE APPS</text>
      <rect y="22" width="152" height="4" rx="2" fill="#334155"/>
      <rect y="30" width="110" height="4" rx="2" fill="#059669"/>
      
      <rect y="42" width="152" height="34" rx="6" fill="#0f172a" stroke="#064e3b"/>
      <text x="8" y="55" font-family="ui-monospace, monospace" font-size="7.5" font-weight="bold" fill="#ffffff">iOS &amp; Android Native</text>
      <text x="8" y="67" font-family="ui-monospace, monospace" font-size="6.5" fill="#94a3b8">Flutter · Push · Offline Sync</text>
    </g>
  </g>
</svg>
