<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="100%" height="100%">
  <defs>
    <linearGradient id="restoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="restoOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="restoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="restoEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="restoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="restoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="640" fill="url(#restoBgGrad)" rx="24"/>

  <!-- Perspective Isometric Grid Floor -->
  <g opacity="0.15" stroke="#f97316" stroke-width="1.2">
    <path d="M 100 480 L 400 320 L 700 480 L 400 640 Z"/>
    <path d="M 160 480 L 400 350 L 640 480 L 400 610 Z"/>
    <path d="M 220 480 L 400 380 L 580 480 L 400 580 Z"/>
    <line x1="400" y1="320" x2="400" y2="640"/>
    <line x1="250" y1="400" x2="550" y2="560"/>
    <line x1="550" y1="400" x2="250" y2="560"/>
  </g>

  <!-- Glowing Central Ground Platform -->
  <ellipse cx="400" cy="460" rx="270" ry="90" fill="#c2410c" opacity="0.25" filter="url(#restoGlow)"/>
  <ellipse cx="400" cy="460" rx="210" ry="65" fill="none" stroke="#f97316" stroke-width="2" opacity="0.8"/>
  <ellipse cx="400" cy="460" rx="150" ry="45" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Central Restaurant Smart Dining Table with Table Stand QR -->
  <g transform="translate(240, 340)">
    <!-- Table Stand Base -->
    <ellipse cx="0" cy="90" rx="60" ry="24" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M -12 90 L 12 90 L 14 30 L -14 30 Z" fill="#334155"/>
    <!-- Table Top (Polished Wood & Glass) -->
    <ellipse cx="0" cy="30" rx="110" ry="42" fill="#0f172a" stroke="#f97316" stroke-width="2.5" filter="url(#restoGlow)"/>
    <ellipse cx="0" cy="30" rx="98" ry="36" fill="#1e293b" opacity="0.9"/>
    
    <!-- Table Number Beacon "MEJA 08" -->
    <g transform="translate(0, 10)">
      <rect x="-35" y="-28" width="70" height="24" rx="6" fill="#f97316"/>
      <text x="0" y="-12" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle">MEJA 08</text>
    </g>

    <!-- Holographic QR Code Acrylic Stand -->
    <g transform="translate(0, -25)">
      <!-- Acrylic base -->
      <path d="M -22 10 L 22 10 L 16 0 L -16 0 Z" fill="#475569"/>
      <!-- QR Card Face -->
      <rect x="-26" y="-55" width="52" height="55" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Glowing QR Pattern Mockup -->
      <rect x="-20" y="-49" width="16" height="16" fill="#0f172a" rx="2"/>
      <rect x="-17" y="-46" width="10" height="10" fill="#ffffff"/>
      <rect x="-15" y="-44" width="6" height="6" fill="#0f172a"/>

      <rect x="4" y="-49" width="16" height="16" fill="#0f172a" rx="2"/>
      <rect x="7" y="-46" width="10" height="10" fill="#ffffff"/>
      <rect x="9" y="-44" width="6" height="6" fill="#0f172a"/>

      <rect x="-20" y="-25" width="16" height="16" fill="#0f172a" rx="2"/>
      <rect x="-17" y="-22" width="10" height="10" fill="#ffffff"/>
      <rect x="-15" y="-20" width="6" height="6" fill="#0f172a"/>

      <rect x="2" y="-25" width="8" height="6" fill="#f97316" rx="1"/>
      <rect x="12" y="-20" width="8" height="6" fill="#0f172a" rx="1"/>
      <text x="0" y="-4" fill="#0f172a" font-family="sans-serif" font-weight="800" font-size="6" text-anchor="middle">SCAN TO ORDER</text>

      <!-- Laser Scan Hologram Cone -->
      <polygon points="-26,-55 26,-55 70,-150 -70,-150" fill="url(#restoOrangeGrad)" opacity="0.18"/>
      <line x1="-30" y1="-55" x2="30" y2="-55" stroke="#f97316" stroke-width="2" filter="url(#restoGlow)"/>
    </g>

    <!-- Food Plating Mockup on Table -->
    <g transform="translate(-55, 30)">
      <ellipse cx="0" cy="0" rx="24" ry="10" fill="#334155"/>
      <ellipse cx="0" cy="-2" rx="20" ry="8" fill="#e2e8f0"/>
      <!-- Gourmet Steak / Dish -->
      <ellipse cx="0" cy="-4" rx="12" ry="5" fill="#78350f"/>
      <ellipse cx="-4" cy="-5" rx="4" ry="2" fill="#22c55e"/>
      <ellipse cx="5" cy="-4" rx="3" ry="2" fill="#ef4444"/>
    </g>

    <!-- Refreshing Beverage / Mockup Drink -->
    <g transform="translate(58, 25)">
      <path d="M -8 8 L 8 8 L 10 -15 L -10 -15 Z" fill="#38bdf8" opacity="0.75" stroke="#ffffff" stroke-width="1"/>
      <line x1="2" y1="-20" x2="-4" y2="4" stroke="#f43f5e" stroke-width="2"/>
    </g>
  </g>

  <!-- Floating Smartphone Guest Ordering UI (Center Left) -->
  <g transform="translate(190, 150) rotate(-6)">
    <!-- Phone Body -->
    <rect x="-70" y="-120" width="140" height="240" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#restoGlow)"/>
    <!-- Phone Screen -->
    <rect x="-62" y="-108" width="124" height="216" rx="14" fill="#1e293b"/>
    <!-- Dynamic Island / Speaker -->
    <rect x="-18" y="-102" width="36" height="8" rx="4" fill="#0f172a"/>
    
    <!-- Resto App Header in Phone -->
    <rect x="-56" y="-88" width="112" height="26" rx="6" fill="#f97316"/>
    <text x="-48" y="-72" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="9">Nusantara Bistro</text>
    <text x="36" y="-72" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="8">M-08</text>

    <!-- Menu Item 1: Wagyu Ribeye -->
    <rect x="-56" y="-56" width="112" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="-50" y="-50" width="22" height="22" rx="4" fill="#ea580c"/>
    <text x="-22" y="-42" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="8">Wagyu Ribeye Steak</text>
    <text x="-22" y="-32" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="7">Rp 165.000</text>
    <rect x="34" y="-45" width="16" height="14" rx="3" fill="#22c55e"/>
    <text x="42" y="-35" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle">+</text>

    <!-- Menu Item 2: Truffle Pasta -->
    <rect x="-56" y="-16" width="112" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="-50" y="-10" width="22" height="22" rx="4" fill="#ca8a04"/>
    <text x="-22" y="-2" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="8">Truffle Fettuccine</text>
    <text x="-22" y="8" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="7">Rp 88.000</text>
    <rect x="34" y="-5" width="16" height="14" rx="3" fill="#22c55e"/>
    <text x="42" y="5" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle">+</text>

    <!-- Action Bar: Call Waiter & Submit Order -->
    <g transform="translate(0, 50)">
      <rect x="-56" y="0" width="46" height="22" rx="5" fill="#475569"/>
      <text x="-33" y="14" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="7" text-anchor="middle">🛎️ Panggil</text>
      
      <rect x="-4" y="0" width="60" height="22" rx="5" fill="url(#restoEmeraldGrad)"/>
      <text x="26" y="14" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="7" text-anchor="middle">Kirim Order →</text>
    </g>

    <!-- Live Status Pill -->
    <rect x="-56" y="80" width="112" height="18" rx="4" fill="#0f172a"/>
    <circle cx="-46" cy="89" r="3" fill="#22c55e"/>
    <text x="-38" y="92" fill="#94a3b8" font-family="sans-serif" font-weight="600" font-size="6.5">Order Live Terhubung ke KDS</text>
  </g>

  <!-- Central-Right: Large Floating Kitchen Display System (KDS) Screen -->
  <g transform="translate(540, 260)">
    <!-- Monitor Stand -->
    <path d="M -30 150 L 30 150 L 15 100 L -15 100 Z" fill="#334155"/>
    <ellipse cx="0" cy="150" rx="50" ry="16" fill="#1e293b"/>

    <!-- Large KDS Touchscreen Monitor Body -->
    <rect x="-170" y="-120" width="340" height="220" rx="16" fill="#0f172a" stroke="#f97316" stroke-width="3" filter="url(#restoGlow)"/>
    <rect x="-158" y="-108" width="316" height="196" rx="10" fill="#1e1b4b"/>

    <!-- KDS Header Bar -->
    <rect x="-158" y="-108" width="316" height="26" rx="8" fill="#1e293b"/>
    <circle cx="-144" cy="-95" r="4" fill="#ef4444"/>
    <circle cx="-132" cy="-95" r="4" fill="#f59e0b"/>
    <circle cx="-120" cy="-95" r="4" fill="#10b981"/>
    <text x="-95" y="-92" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="9">KDS STATION: DAPUR UTAMA &amp; GRILL</text>
    <rect x="80" y="-103" width="66" height="16" rx="4" fill="#f97316"/>
    <text x="113" y="-92" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="8" text-anchor="middle">LIVE (4 ORDER)</text>

    <!-- Ticket 1: Meja 08 (Cooking / In Progress) -->
    <g transform="translate(-148, -72)">
      <rect x="0" y="0" width="94" height="145" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1.8"/>
      <!-- Ticket Top -->
      <rect x="0" y="0" width="94" height="24" rx="4" fill="#f97316"/>
      <text x="6" y="16" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="10">MEJA 08</text>
      <text x="86" y="16" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="8" text-anchor="end">04:18</text>

      <!-- Ticket Items -->
      <text x="6" y="38" fill="#e2e8f0" font-family="sans-serif" font-weight="700" font-size="8">1x Wagyu Ribeye</text>
      <text x="12" y="48" fill="#fde047" font-family="sans-serif" font-weight="600" font-size="6.5">↳ Medium Rare, Blackpepper</text>

      <text x="6" y="64" fill="#e2e8f0" font-family="sans-serif" font-weight="700" font-size="8">1x Truffle Pasta</text>
      <text x="12" y="74" fill="#fde047" font-family="sans-serif" font-weight="600" font-size="6.5">↳ Extra Parmesan</text>

      <text x="6" y="90" fill="#e2e8f0" font-family="sans-serif" font-weight="700" font-size="8">2x Ice Lemon Tea</text>
      <text x="12" y="100" fill="#94a3b8" font-family="sans-serif" font-weight="600" font-size="6.5">↳ Less Sugar</text>

      <!-- Button Selesai Masak -->
      <rect x="6" y="116" width="82" height="20" rx="4" fill="#22c55e"/>
      <text x="47" y="130" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="8" text-anchor="middle">✓ SELESAI MASAK</text>
    </g>

    <!-- Ticket 2: Meja 03 (New Order) -->
    <g transform="translate(-46, -72)">
      <rect x="0" y="0" width="94" height="145" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="0" y="0" width="94" height="24" rx="4" fill="#0284c7"/>
      <text x="6" y="16" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="10">MEJA 03</text>
      <text x="86" y="16" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="8" text-anchor="end">01:05</text>

      <text x="6" y="38" fill="#e2e8f0" font-family="sans-serif" font-weight="700" font-size="8">2x Nasi Goreng Sei</text>
      <text x="12" y="48" fill="#fde047" font-family="sans-serif" font-weight="600" font-size="6.5">↳ Pedas Level 3</text>

      <text x="6" y="64" fill="#e2e8f0" font-family="sans-serif" font-weight="700" font-size="8">1x Crispy Calamari</text>
      <text x="12" y="74" fill="#94a3b8" font-family="sans-serif" font-weight="600" font-size="6.5">↳ Tartar Sauce</text>

      <rect x="6" y="116" width="82" height="20" rx="4" fill="#3b82f6"/>
      <text x="47" y="130" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="8" text-anchor="middle">MULAI PROSES</text>
    </g>

    <!-- Ticket 3: Meja 12 (Ready for Delivery) -->
    <g transform="translate(56, -72)">
      <rect x="0" y="0" width="94" height="145" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="0" y="0" width="94" height="24" rx="4" fill="#15803d"/>
      <text x="6" y="16" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="10">MEJA 12</text>
      <text x="86" y="16" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="8" text-anchor="end">READY</text>

      <text x="6" y="38" fill="#86efac" font-family="sans-serif" font-weight="700" font-size="8">✓ 1x Tom Yum Soup</text>
      <text x="6" y="52" fill="#86efac" font-family="sans-serif" font-weight="700" font-size="8">✓ 2x Steam Jasmine</text>
      <text x="6" y="66" fill="#86efac" font-family="sans-serif" font-weight="700" font-size="8">✓ 1x Mango Sticky</text>

      <rect x="6" y="116" width="82" height="20" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
      <text x="47" y="130" fill="#22c55e" font-family="sans-serif" font-weight="800" font-size="7.5" text-anchor="middle">🛎️ PANGGIL WAITER</text>
    </g>
  </g>

  <!-- Tech Character: Cyber Executive Chef (Center-Right Front) -->
  <g transform="translate(420, 360)">
    <!-- Shadow -->
    <ellipse cx="0" cy="120" rx="45" ry="16" fill="#090d16" opacity="0.6"/>

    <!-- Chef Body & Cyber Apron -->
    <!-- Pants -->
    <path d="M -18 70 L -18 115 L -6 115 L -4 75 L 4 75 L 6 115 L 18 115 L 18 70 Z" fill="#1e293b"/>
    <!-- Modern Chef Jacket & Cyber Holo Apron -->
    <path d="M -28 10 L 28 10 L 24 75 L -24 75 Z" fill="#ffffff"/>
    <path d="M -16 12 L 16 12 L 12 70 L -12 70 Z" fill="#f97316" opacity="0.9"/>
    <!-- Double-breasted Chef Buttons -->
    <circle cx="-8" cy="24" r="2.5" fill="#ffffff"/>
    <circle cx="-8" cy="38" r="2.5" fill="#ffffff"/>
    <circle cx="-8" cy="52" r="2.5" fill="#ffffff"/>
    <circle cx="8" cy="24" r="2.5" fill="#ffffff"/>
    <circle cx="8" cy="38" r="2.5" fill="#ffffff"/>
    <circle cx="8" cy="52" r="2.5" fill="#ffffff"/>

    <!-- Left Arm holding Digital Stylus / Tablet Controller -->
    <path d="M -28 15 L -44 38 L -36 50 L -22 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <!-- Tablet Pad -->
    <rect x="-56" y="38" width="22" height="30" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="-50" y1="46" x2="-38" y2="46" stroke="#f97316" stroke-width="1.5"/>
    <line x1="-50" y1="54" x2="-42" y2="54" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Right Arm Gesturing at KDS Screen -->
    <path d="M 28 15 L 50 5 L 68 -15" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <circle cx="68" cy="-15" r="4.5" fill="#f97316"/>

    <!-- Head & Neck -->
    <rect x="-8" y="-2" width="16" height="14" fill="#fed7aa" rx="2"/>
    <ellipse cx="0" cy="-14" rx="16" ry="18" fill="#fed7aa"/>
    <!-- Face details -->
    <!-- Hair -->
    <path d="M -16 -20 Q 0 -34 16 -20 Q 14 -12 16 -8 L -16 -8 Z" fill="#1e293b"/>
    <!-- Cyber Visor / Smart Headset Glasses -->
    <path d="M -15 -14 L 15 -14 L 13 -8 L -13 -8 Z" fill="#0284c7" filter="url(#restoGlow)"/>
    <line x1="-15" y1="-11" x2="15" y2="-11" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Friendly Smile -->
    <path d="M -5 -2 Q 0 3 5 -2" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Professional Tall White Chef Toque (Hat) -->
    <path d="M -14 -22 L 14 -22 L 13 -30 L -13 -30 Z" fill="#e2e8f0"/>
    <path d="M -13 -30 C -22 -40 -16 -62 0 -64 C 16 -62 22 -40 13 -30 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Toque Folds -->
    <path d="M -7 -30 L -7 -54 M 0 -30 L 0 -58 M 7 -30 L 7 -54" stroke="#e2e8f0" stroke-width="1.2"/>
  </g>

  <!-- Floating Holographic Data Rings & Signal Streams -->
  <g opacity="0.6">
    <!-- Stream from phone to KDS -->
    <path d="M 230 180 Q 370 120 480 200" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="340" cy="148" r="4" fill="#f97316" filter="url(#restoGlow)"/>
    <circle cx="420" cy="168" r="3" fill="#38bdf8"/>

    <!-- Smart Cloud Server Pulse icon -->
    <g transform="translate(400, 100)">
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
      <text x="0" y="-4" fill="#f97316" font-family="sans-serif" font-weight="900" font-size="8" text-anchor="middle">AXUM 0.8</text>
      <text x="0" y="8" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="7" text-anchor="middle">&lt; 5ms SYNC</text>
    </g>
  </g>

  <!-- Glowing Floor Accents -->
  <circle cx="240" cy="480" r="8" fill="#f97316" opacity="0.7" filter="url(#restoGlow)"/>
  <circle cx="580" cy="490" r="6" fill="#38bdf8" opacity="0.7" filter="url(#restoGlow)"/>
</svg>
