<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="prTitle" preserveAspectRatio="xMidYMid meet">
  <title id="prTitle">Supernova Engineering Principles &amp; Architecture Standard</title>
  <defs>
    <filter id="prShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Technical Background Target Crosshair -->
  <g opacity="0.3" stroke="#94a3b8" stroke-width="0.8">
    <circle cx="280" cy="180" r="130" fill="none" stroke="#2563eb" stroke-dasharray="3 4"/>
    <line x1="280" y1="30" x2="280" y2="330" stroke-dasharray="4 4"/>
    <line x1="130" y1="180" x2="430" y2="180" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Security & Quality Shield -->
  <g transform="translate(210, 110)" filter="url(#prShadow)">
    <rect width="140" height="140" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 280 135 L 250 150 L 250 190 Q 250 220 280 235 Q 310 220 310 190 L 310 150 Z" transform="translate(-210, -110)" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M 268 182 L 276 190 L 294 172" transform="translate(-210, -110)" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#ffffff">AUDIT VERIFIED</text>
    <text x="70" y="120" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7.5" fill="#38bdf8">ISO / OWASP Compliant</text>
  </g>

  <!-- Principle 1: Solid Architecture (Top-Left) -->
  <g transform="translate(40, 50)" filter="url(#prShadow)">
    <rect width="150" height="74" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="12" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1e3a8a">01 · Solid Architecture</text>
    <text x="12" y="38" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">Decoupled Modules</text>
    <rect x="12" y="48" width="126" height="16" rx="4" fill="#eff6ff"/>
    <text x="20" y="60" font-family="ui-monospace, monospace" font-size="7.5" font-weight="bold" fill="#2563eb">Scale for 5+ Years</text>
  </g>

  <!-- Principle 2: Clean Code (Top-Right) -->
  <g transform="translate(370, 50)" filter="url(#prShadow)">
    <rect width="150" height="74" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="12" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#4c1d95">02 · Clean Code</text>
    <text x="12" y="38" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">Typed &amp; Documented</text>
    <rect x="12" y="48" width="126" height="16" rx="4" fill="#faf5ff"/>
    <text x="20" y="60" font-family="ui-monospace, monospace" font-size="7.5" font-weight="bold" fill="#7c3aed">Zero Tribal Knowledge</text>
  </g>

  <!-- Principle 3: Security-First (Bottom-Left) -->
  <g transform="translate(40, 235)" filter="url(#prShadow)">
    <rect width="150" height="74" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="12" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#065f46">03 · Security Hardening</text>
    <text x="12" y="38" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">Encrypted at Rest &amp; Transit</text>
    <rect x="12" y="48" width="126" height="16" rx="4" fill="#ecfdf5"/>
    <text x="20" y="60" font-family="ui-monospace, monospace" font-size="7.5" font-weight="bold" fill="#059669">Pre-release Pentesting</text>
  </g>

  <!-- Principle 4: Native Speed (Bottom-Right) -->
  <g transform="translate(370, 235)" filter="url(#prShadow)">
    <rect width="150" height="74" rx="10" fill="#ffffff" stroke="#67e8f9" stroke-width="1.5"/>
    <text x="12" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0e7490">04 · Native Performance</text>
    <text x="12" y="38" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">Zero Bloatware JS</text>
    <rect x="12" y="48" width="126" height="16" rx="4" fill="#ecfeff"/>
    <text x="20" y="60" font-family="ui-monospace, monospace" font-size="7.5" font-weight="bold" fill="#0891b2">Lighthouse 100 Baseline</text>
  </g>

</svg>