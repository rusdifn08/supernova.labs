<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="faqTitle" preserveAspectRatio="xMidYMid meet">
  <title id="faqTitle">Technical FAQ &amp; Advisory</title>
  <defs>
    <filter id="faqShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g transform="translate(60, 40)" filter="url(#faqShadow)">
    <rect width="440" height="280" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
    <rect width="440" height="26" rx="14" fill="#0f172a"/>
    <rect y="12" width="440" height="14" fill="#0f172a"/>
    <circle cx="20" cy="13" r="3.5" fill="#ef4444"/>
    <circle cx="32" cy="13" r="3.5" fill="#f59e0b"/>
    <circle cx="44" cy="13" r="3.5" fill="#10b981"/>
    <text x="60" y="17" font-family="ui-monospace, monospace" font-size="8.5" fill="#94a3b8">supernova.knowledgebase // b2b-contracts-and-ip</text>

    <!-- FAQ Cards Simulation -->
    <g transform="translate(20, 42)">
      <!-- Item 1 -->
      <rect width="400" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="24" cy="20" r="10" fill="#eff6ff"/>
      <text x="24" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#2563eb">Q1</text>
      <text x="44" y="22" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a">Apakah Source Code 100% Menjadi Milik Kami?</text>
      <text x="44" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Ya. Repositori Git, skema database, dan kunci diserahkan tanpa royalti atau vendor lock-in.</text>

      <!-- Item 2 -->
      <g transform="translate(0, 72)">
        <rect width="400" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="24" cy="20" r="10" fill="#faf5ff"/>
        <text x="24" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">Q2</text>
        <text x="44" y="22" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a">Bagaimana Jika Belum Punya Dokumen Spesifikasi Teknis?</text>
        <text x="44" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Lead Architect kami membantu membedah alur proses bisnis Anda menjadi system flow teruji.</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 144)">
        <rect width="400" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="24" cy="20" r="10" fill="#ecfeff"/>
        <text x="24" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0891b2">Q3</text>
        <text x="44" y="22" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a">Berapa Estimasi Timeline Development untuk MVP?</text>
        <text x="44" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Rata-rata 4-8 minggu dengan siklus rilis mingguan ke staging environment.</text>
      </g>
    </g>
  </g>
</svg>