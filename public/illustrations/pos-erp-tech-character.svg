<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="100%" height="100%">
  <defs>
    <linearGradient id="posBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="posBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="posEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="posPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="posGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="640" fill="url(#posBgGrad)" rx="24"/>

  <!-- Perspective Isometric Grid -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.2">
    <path d="M 100 480 L 400 320 L 700 480 L 400 640 Z"/>
    <path d="M 160 480 L 400 350 L 640 480 L 400 610 Z"/>
    <path d="M 220 480 L 400 380 L 580 480 L 400 580 Z"/>
    <line x1="400" y1="320" x2="400" y2="640"/>
    <line x1="250" y1="400" x2="550" y2="560"/>
    <line x1="550" y1="400" x2="250" y2="560"/>
  </g>

  <!-- Glowing Central Platform -->
  <ellipse cx="400" cy="460" rx="260" ry="85" fill="#1e3a8a" opacity="0.35" filter="url(#posGlow)"/>
  <ellipse cx="400" cy="460" rx="200" ry="60" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <ellipse cx="400" cy="460" rx="140" ry="40" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Isometric Smart POS Terminal -->
  <g transform="translate(400, 310)">
    <!-- Terminal Stand Base -->
    <path d="M -70 120 L 0 155 L 70 120 L 0 85 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M -20 85 L 0 95 L 20 85 L 20 20 L -20 20 Z" fill="#334155"/>
    
    <!-- Screen Chassis -->
    <g transform="rotate(-15) translate(-10, -50)">
      <rect x="-110" y="-70" width="220" height="135" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#posGlow)"/>
      <rect x="-98" y="-58" width="196" height="111" rx="8" fill="#1e1b4b"/>
      
      <!-- Holographic UI Screen elements -->
      <!-- Header bar -->
      <rect x="-90" y="-50" width="180" height="14" rx="3" fill="#2563eb" opacity="0.8"/>
      <circle cx="-80" cy="-43" r="3" fill="#38bdf8"/>
      <rect x="-70" y="-46" width="40" height="6" rx="2" fill="#ffffff" opacity="0.9"/>
      
      <!-- Left: Products in Cart -->
      <rect x="-90" y="-28" width="105" height="16" rx="3" fill="#334155" opacity="0.8"/>
      <rect x="-84" y="-23" width="50" height="6" rx="2" fill="#38bdf8"/>
      <rect x="-20" y="-23" width="28" height="6" rx="2" fill="#34d399"/>

      <rect x="-90" y="-8" width="105" height="16" rx="3" fill="#334155" opacity="0.6"/>
      <rect x="-84" y="-3" width="45" height="6" rx="2" fill="#cbd5e1"/>
      <rect x="-20" y="-3" width="28" height="6" rx="2" fill="#34d399"/>

      <rect x="-90" y="12" width="105" height="16" rx="3" fill="#334155" opacity="0.6"/>
      <rect x="-84" y="17" width="60" height="6" rx="2" fill="#cbd5e1"/>
      <rect x="-20" y="17" width="28" height="6" rx="2" fill="#34d399"/>

      <!-- Right: Total & QRIS Pay Button -->
      <rect x="25" y="-28" width="65" height="36" rx="4" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
      <rect x="32" y="-22" width="50" height="5" rx="2" fill="#94a3b8"/>
      <rect x="32" y="-12" width="50" height="12" rx="2" fill="#38bdf8"/>
      
      <!-- Pay Button -->
      <rect x="25" y="14" width="65" height="22" rx="4" fill="#059669"/>
      <text x="57" y="29" fill="#ffffff" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">BAYAR QRIS</text>
    </g>
  </g>

  <!-- Holographic ERP Inventory Box & Barcode Scanner Drone (Left) -->
  <g transform="translate(190, 240)">
    <!-- Floating Inventory Cube -->
    <g transform="translate(0, 20)">
      <!-- Top Face -->
      <path d="M 0 -35 L 50 -10 L 0 15 L -50 -10 Z" fill="#60a5fa" opacity="0.9"/>
      <!-- Left Face -->
      <path d="M -50 -10 L 0 15 L 0 75 L -50 50 Z" fill="#2563eb" opacity="0.85"/>
      <!-- Right Face -->
      <path d="M 0 15 L 50 -10 L 50 50 L 0 75 Z" fill="#1d4ed8" opacity="0.95"/>
      <!-- Box Tape -->
      <path d="M -15 -27 L 15 -13 L 15 65 L -15 51 Z" fill="#93c5fd" opacity="0.4"/>
      <!-- Barcode on box -->
      <g transform="translate(-35, 15) rotate(26)">
        <line x1="0" y1="0" x2="0" y2="20" stroke="#ffffff" stroke-width="2"/>
        <line x1="5" y1="0" x2="5" y2="20" stroke="#ffffff" stroke-width="1"/>
        <line x1="9" y1="0" x2="9" y2="20" stroke="#ffffff" stroke-width="3"/>
        <line x1="16" y1="0" x2="16" y2="20" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="22" y1="0" x2="22" y2="20" stroke="#ffffff" stroke-width="2"/>
      </g>
    </g>

    <!-- Scanner Drone with Laser Beam -->
    <g transform="translate(0, -60)">
      <ellipse cx="0" cy="0" rx="35" ry="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="0" cy="-6" r="10" fill="#38bdf8" filter="url(#posGlow)"/>
      <!-- Rotors -->
      <line x1="-45" y1="-5" x2="-20" y2="-5" stroke="#38bdf8" stroke-width="2"/>
      <line x1="20" y1="-5" x2="45" y2="-5" stroke="#38bdf8" stroke-width="2"/>
      <!-- Red/Cyan Laser Scan Line -->
      <polygon points="0,5 -40,90 40,90" fill="url(#posEmeraldGrad)" opacity="0.25"/>
      <line x1="-30" y1="80" x2="30" y2="80" stroke="#34d399" stroke-width="2" filter="url(#posGlow)"/>
    </g>

    <!-- Label Pill -->
    <rect x="-65" y="115" width="130" height="26" rx="13" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="0" y="132" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">STOK LIVE AUTO-SYNC</text>
  </g>

  <!-- Financial Ledger & CRM Analytics Pillar (Right) -->
  <g transform="translate(610, 240)">
    <!-- Holographic Financial Graph Board -->
    <rect x="-85" y="-50" width="170" height="120" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="2" filter="url(#posGlow)"/>
    
    <!-- Growth Curve -->
    <path d="M -70 45 Q -30 20 0 10 T 65 -30" fill="none" stroke="#34d399" stroke-width="3"/>
    <path d="M -70 45 Q -30 20 0 10 T 65 -30 L 65 50 L -70 50 Z" fill="url(#posEmeraldGrad)" opacity="0.2"/>
    
    <!-- Data points -->
    <circle cx="-70" cy="45" r="4" fill="#34d399"/>
    <circle cx="-15" cy="18" r="4" fill="#34d399"/>
    <circle cx="25" cy="-8" r="4" fill="#34d399"/>
    <circle cx="65" cy="-30" r="5" fill="#ffffff" stroke="#34d399" stroke-width="2" filter="url(#posGlow)"/>

    <!-- CRM Member Hologram Badge -->
    <g transform="translate(0, 95)">
      <rect x="-70" y="0" width="140" height="34" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="-48" cy="17" r="9" fill="#c084fc"/>
      <text x="-48" y="21" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">👤</text>
      <text x="12" y="15" fill="#ffffff" font-size="10.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">CRM &amp; MEMBER</text>
      <text x="12" y="27" fill="#34d399" font-size="9" font-family="sans-serif" text-anchor="middle">+1.420 Pelanggan</text>
    </g>
  </g>

  <!-- Foreground Data Packet Nodes -->
  <circle cx="320" cy="470" r="6" fill="#38bdf8" filter="url(#posGlow)"/>
  <circle cx="480" cy="460" r="6" fill="#34d399" filter="url(#posGlow)"/>
  <circle cx="400" cy="530" r="5" fill="#c084fc" filter="url(#posGlow)"/>

  <!-- Brand Signature Pill -->
  <g transform="translate(400, 585)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="-118" cy="0" r="5" fill="#10b981" filter="url(#posGlow)"/>
    <text x="8" y="4" fill="#cbd5e1" font-size="11.5" font-weight="bold" font-family="ui-monospace, monospace" text-anchor="middle">
      SUPERNOVA POS · ERP · LEDGER ACID
    </text>
  </g>
</svg>
