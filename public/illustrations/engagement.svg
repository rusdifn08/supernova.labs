<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="engTitle" preserveAspectRatio="xMidYMid meet">
  <title id="engTitle">Supernova Engagement Models Comparison</title>
  <defs>
    <filter id="engShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Technical Background Grid -->
  <line x1="280" y1="40" x2="280" y2="320" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Left Model: Project-Based -->
  <g transform="translate(30, 45)" filter="url(#engShadow)">
    <rect width="230" height="270" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/>
    <rect width="230" height="26" rx="14" fill="#1e3a8a"/>
    <rect y="12" width="230" height="14" fill="#1e3a8a"/>
    <text x="14" y="17" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#ffffff">MODEL A : PROJECT-BASED</text>

    <g transform="translate(16, 38)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Fixed Scope &amp; Budget</text>
      <text x="0" y="30" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Cocok untuk MVP &amp; spesifikasi terkunci.</text>

      <!-- Checklist -->
      <g transform="translate(0, 44)">
        <circle cx="6" cy="6" r="6" fill="#eff6ff"/>
        <path d="M 3 6 L 5 8 L 9 4" stroke="#2563eb" stroke-width="1.5" fill="none"/>
        <text x="18" y="9" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Kepastian biaya dari awal</text>

        <circle cx="6" cy="28" r="6" fill="#eff6ff"/>
        <path d="M 3 28 L 5 30 L 9 26" stroke="#2563eb" stroke-width="1.5" fill="none"/>
        <text x="18" y="31" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Milestone rilis terikat kontrak</text>

        <circle cx="6" cy="50" r="6" fill="#eff6ff"/>
        <path d="M 3 50 L 5 52 L 9 48" stroke="#2563eb" stroke-width="1.5" fill="none"/>
        <text x="18" y="53" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Handover kode 100% penuh</text>

        <circle cx="6" cy="72" r="6" fill="#eff6ff"/>
        <path d="M 3 72 L 5 74 L 9 70" stroke="#2563eb" stroke-width="1.5" fill="none"/>
        <text x="18" y="75" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Garansi bug pasca-peluncuran</text>
      </g>

      <rect y="160" width="198" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="177" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#1d4ed8">Paling Banyak Dipilih Startup</text>
    </g>
  </g>

  <!-- Right Model: Dedicated Team -->
  <g transform="translate(300, 45)" filter="url(#engShadow)">
    <rect width="230" height="270" rx="14" fill="#0f172a" stroke="#4f46e5" stroke-width="1.8"/>
    <text x="16" y="24" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#818cf8">MODEL B : DEDICATED SQUAD</text>

    <g transform="translate(16, 38)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Continuous Velocity</text>
      <text x="0" y="30" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Kapasitas engineering bulanan tanpa rekrutmen.</text>

      <!-- Checklist -->
      <g transform="translate(0, 44)">
        <circle cx="6" cy="6" r="6" fill="#1e293b"/>
        <path d="M 3 6 L 5 8 L 9 4" stroke="#818cf8" stroke-width="1.5" fill="none"/>
        <text x="18" y="9" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">Full Squad (FE + BE + PM + QA)</text>

        <circle cx="6" cy="28" r="6" fill="#1e293b"/>
        <path d="M 3 28 L 5 30 L 9 26" stroke="#818cf8" stroke-width="1.5" fill="none"/>
        <text x="18" y="31" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">Siklus sprint 2 mingguan</text>

        <circle cx="6" cy="50" r="6" fill="#1e293b"/>
        <path d="M 3 50 L 5 52 L 9 48" stroke="#818cf8" stroke-width="1.5" fill="none"/>
        <text x="18" y="53" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">Prioritas backlog fleksibel</text>

        <circle cx="6" cy="72" r="6" fill="#1e293b"/>
        <path d="M 3 72 L 5 74 L 9 70" stroke="#818cf8" stroke-width="1.5" fill="none"/>
        <text x="18" y="75" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">Standup harian &amp; transparansi</text>
      </g>

      <rect y="160" width="198" height="28" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="10" y="177" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#a5b4fc">Ideal untuk Scale-Up &amp; Enterprise</text>
    </g>
  </g>
</svg>