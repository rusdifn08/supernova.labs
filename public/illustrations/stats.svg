<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-labelledby="statsTitle" preserveAspectRatio="xMidYMid meet">
  <title id="statsTitle">Supernova Engineering Telemetry &amp; Metrics</title>
  <defs>
    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="stShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Technical Frame Background (Dark High-Tech Monitor) -->
  <rect x="20" y="20" width="520" height="180" rx="14" fill="#090d16" stroke="#334155" stroke-width="1.5" filter="url(#stShadow)"/>
  <rect x="20" y="20" width="520" height="28" rx="14" fill="#0f172a"/>
  <rect x="20" y="34" width="520" height="14" fill="#0f172a"/>
  <circle cx="36" cy="34" r="3.5" fill="#ef4444"/>
  <circle cx="48" cy="34" r="3.5" fill="#f59e0b"/>
  <circle cx="60" cy="34" r="3.5" fill="#10b981"/>
  <text x="76" y="37" font-family="ui-monospace, monospace" font-size="8.5" fill="#94a3b8">telemetry://supernova.monitoring/production-vitals</text>

  <!-- Inner Metrics -->
  <g transform="translate(40, 62)">
    <!-- Metric 1: Lighthouse Score 100 -->
    <g transform="translate(0, 5)">
      <circle cx="35" cy="40" r="28" fill="#064e3b" stroke="#10b981" stroke-width="3"/>
      <text x="35" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#34d399">100</text>
      <text x="35" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7.5" font-weight="bold" fill="#6ee7b7">LIGHTHOUSE</text>
    </g>

    <!-- Metric 2: Latency Chart -->
    <g transform="translate(90, 0)">
      <rect width="260" height="90" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="18" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8">API P99 LATENCY (AVG: 24ms)</text>
      
      <!-- Chart Grid Lines -->
      <line x1="12" y1="35" x2="248" y2="35" stroke="#1e293b" stroke-dasharray="2 3"/>
      <line x1="12" y1="55" x2="248" y2="55" stroke="#1e293b" stroke-dasharray="2 3"/>
      <line x1="12" y1="75" x2="248" y2="75" stroke="#1e293b" stroke-dasharray="2 3"/>

      <!-- Smooth Line Path -->
      <polyline points="18,72 50,65 90,48 130,52 170,38 210,42 245,30" fill="none" stroke="url(#chartLineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="245" cy="30" r="4" fill="#10b981"/>
    </g>

    <!-- Metric 3: Live Stats Column -->
    <g transform="translate(370, 0)">
      <rect width="110" height="40" rx="6" fill="#1e3a8a" stroke="#2563eb"/>
      <text x="10" y="16" font-family="ui-monospace, monospace" font-size="7.5" fill="#93c5fd">UPTIME SLA</text>
      <text x="10" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">99.98%</text>

      <rect y="48" width="110" height="40" rx="6" fill="#3b0764" stroke="#7c3aed"/>
      <text x="10" y="64" font-family="ui-monospace, monospace" font-size="7.5" fill="#d8b4fe">HANDOVER</text>
      <text x="10" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">100% IP</text>
    </g>
  </g>
</svg>
