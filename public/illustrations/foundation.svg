<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="foundationTitle" preserveAspectRatio="xMidYMid meet">
  <title id="foundationTitle">Enterprise Architecture &amp; Technology Foundation</title>
  <defs>
    <linearGradient id="fdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="fdShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Technical Grid Background -->
  <g opacity="0.25" stroke="#334155" stroke-width="0.8">
    <line x1="20" y1="60" x2="540" y2="60" stroke-dasharray="3 4"/>
    <line x1="20" y1="160" x2="540" y2="160" stroke-dasharray="3 4"/>
    <line x1="20" y1="260" x2="540" y2="260" stroke-dasharray="3 4"/>
    <line x1="140" y1="20" x2="140" y2="340" stroke-dasharray="3 4"/>
    <line x1="280" y1="20" x2="280" y2="340" stroke-dasharray="3 4"/>
    <line x1="420" y1="20" x2="420" y2="340" stroke-dasharray="3 4"/>
  </g>

  <!-- Layer 1: Edge & Gateway (Top) -->
  <g transform="translate(60, 30)" filter="url(#fdShadow)">
    <rect width="440" height="66" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="1.6"/>
    <rect x="0" y="0" width="440" height="22" rx="12" fill="#1e293b"/>
    <rect x="0" y="10" width="440" height="12" fill="#1e293b"/>
    <text x="14" y="15" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#38bdf8">LAYER 01 : EDGE GATEWAY &amp; CDN</text>
    <text x="360" y="15" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8">Cloudflare · SSL/TLS</text>
    
    <g transform="translate(18, 32)">
      <rect width="90" height="24" rx="5" fill="#0f172a" stroke="#1e3a8a"/>
      <text x="8" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#60a5fa">Edge Routing</text>
      
      <rect x="105" width="90" height="24" rx="5" fill="#0f172a" stroke="#1e3a8a"/>
      <text x="113" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#60a5fa">WAF &amp; Anti-DDoS</text>

      <rect x="210" width="95" height="24" rx="5" fill="#0f172a" stroke="#1e3a8a"/>
      <text x="218" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#60a5fa">Rate Limiting</text>

      <rect x="320" width="84" height="24" rx="5" fill="#064e3b" stroke="#059669"/>
      <text x="328" y="16" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#34d399">0ms Static Cache</text>
    </g>
  </g>

  <!-- Connectors -->
  <line x1="280" y1="96" x2="280" y2="135" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Layer 2: Microservices & Core Logic (Middle) -->
  <g transform="translate(60, 135)" filter="url(#fdShadow)">
    <rect width="440" height="88" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="1.8"/>
    <text x="16" y="24" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#60a5fa">LAYER 02 : HIGH-CONCURRENCY BACKEND CLUSTER</text>
    
    <g transform="translate(16, 36)">
      <rect width="125" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="10" y="17" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#f8fafc">Rust / Axum Engine</text>
      <text x="10" y="30" font-family="ui-monospace, monospace" font-size="7.5" fill="#38bdf8">Ultra Low Memory · Zero Crash</text>

      <rect x="140" width="125" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="150" y="17" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#f8fafc">Node.js / Tokio</text>
      <text x="150" y="30" font-family="ui-monospace, monospace" font-size="7.5" fill="#94a3b8">REST &amp; WebSocket API</text>

      <rect x="280" width="128" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="290" y="17" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#f8fafc">Neon Cloud DB</text>
      <text x="290" y="30" font-family="ui-monospace, monospace" font-size="7.5" fill="#94a3b8">PostgreSQL Serverless</text>
    </g>
  </g>

  <!-- Connectors -->
  <line x1="280" y1="223" x2="280" y2="260" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Layer 3: Persistence & Caching (Bottom) -->
  <g transform="translate(60, 260)" filter="url(#fdShadow)">
    <rect width="440" height="74" rx="12" fill="#090d16" stroke="#c084fc" stroke-width="1.6"/>
    <rect x="0" y="0" width="440" height="20" rx="12" fill="#3b0764"/>
    <rect x="0" y="10" width="440" height="10" fill="#3b0764"/>
    <text x="14" y="14" font-family="ui-monospace, monospace" font-size="8" font-weight="bold" fill="#d8b4fe">LAYER 03 : RELIABLE STORAGE &amp; IN-MEMORY CACHE</text>

    <g transform="translate(18, 28)">
      <rect width="195" height="34" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="10" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#a5b4fc">PostgreSQL Cloud Cluster</text>
      <text x="10" y="27" font-family="ui-monospace, monospace" font-size="7.5" fill="#94a3b8">ACID Transactions · Strict SSL</text>

      <rect x="210" width="195" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="220" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#38bdf8">Redis In-Memory State</text>
      <text x="220" y="27" font-family="ui-monospace, monospace" font-size="7.5" fill="#94a3b8">Pub/Sub · Session State · Cache</text>
    </g>
  </g>
</svg>
